<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raptor Labs — Coming Soon</title>
  <meta name="description" content="Raptor Labs. Something new is on the way.">
  <meta property="og:title" content="Raptor Labs">
  <meta property="og:description" content="Something new is on the way.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M9 23V9h7.5a4.5 4.5 0 0 1 0 9H13l6 5' fill='none' stroke='%23f2f3f5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d10;
      --fg: #f2f3f5;
      --muted: #8a9099;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #c8f169;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 32px 24px;
      background-image:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200, 241, 105, 0.07), transparent 70%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 64px 64px, 64px 64px;
      background-position: center top, center, center;
    }
    header, footer {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      font-size: 14px;
      color: var(--muted);
    }
    header { display: flex; align-items: center; gap: 10px; color: var(--fg); font-weight: 600; letter-spacing: -0.01em; }
    header svg { width: 28px; height: 28px; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 64px 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 28px;
      background: rgba(255, 255, 255, 0.02);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(200, 241, 105, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(200, 241, 105, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(200, 241, 105, 0); }
      100% { box-shadow: 0 0 0 0 rgba(200, 241, 105, 0); }
    }
    h1 {
      font-size: clamp(44px, 9vw, 104px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.045em;
      max-width: 12ch;
    }
    h1 span { color: var(--muted); }
    p.lede {
      margin-top: 28px;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.55;
      color: var(--muted);
      max-width: 34ch;
    }
    footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#f2f3f5"/><path d="M9 23V9h7.5a4.5 4.5 0 0 1 0 9H13l6 5" fill="none" stroke="#0b0d10" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Raptor Labs
  </header>
  <main>
    <div class="badge"><span class="dot"></span>Coming soon</div>
    <h1>Something new is <span>on the way.</span></h1>
    <p class="lede">We're building in stealth. Check back soon.</p>
  </main>
  <footer>
    <span>&copy; <span id="y">2026</span> Raptor Labs</span>
    <span>raptorlabs.co</span>
  </footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
